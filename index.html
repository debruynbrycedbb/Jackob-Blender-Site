<body data-view="room">
  <main class="stage" id="stage">
    <canvas id="scene" tabindex="0" aria-describedby="hint"
      aria-label="A gallery room with a clothes rack holding three denim jackets and a table with a sequin bag. Press Enter or the left arrow to step up to the rack, the right arrow to step up to the table. At the rack, use the arrow keys to bring a jacket forward and Enter to turn it. At the table, press Enter to pick up the bag and the arrow keys to turn it. Escape steps back."></canvas>

    <header class="top">
      <p class="wordmark">Jackob</p>
      <button type="button" class="step-back" id="step-back" hidden>
        <span aria-hidden="true">←</span> Step back
      </button>
    </header>

    <footer class="bottom">
      <div class="caption" id="caption" aria-hidden="true">
        <p class="caption-name">Charcoal denim jacket</p>
        <p class="caption-note">Back: Sagrada Família in amber</p>
      </div>
      <p class="hint" id="hint" aria-live="polite">Click the rack to step closer</p>
    </footer>

    <p class="loading" id="loading" role="status">Hanging the jacket…</p>
    <noscript>
      <p class="noscript">This room is interactive and needs JavaScript. Turn it on to see the jacket in 3D.</p>
    </noscript>
  </main>
  <script type="module" src="js/main.js?v=20261105-1"></script>
</body>
