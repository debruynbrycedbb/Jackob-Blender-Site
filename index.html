<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jackob — Charcoal Denim Jacket</title>
  <meta name="description" content="A charcoal denim jacket with a hand-painted Sagrada Família back, hanging in a quiet gallery room. Step up to the rack and turn the jacket to see the artwork.">
  <meta name="theme-color" content="#1c222b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jackob — Charcoal Denim Jacket">
  <meta property="og:description" content="Step up to the rack and turn the jacket to see the hand-painted back.">
  <meta property="og:image" content="https://debruynbrycedbb.github.io/Jackob-Blender-Site/assets/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="assets/room.jpg" as="image" crossorigin="anonymous">
  <link rel="preload" href="assets/denim_jacket.glb" as="fetch" type="model/gltf-binary" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body data-view="room">
  <main class="stage" id="stage">
    <canvas id="scene" tabindex="0" aria-describedby="hint"
      aria-label="A gallery room with a clothes rack and a charcoal denim jacket. Press Enter to step up to the rack, Enter again to turn the jacket, Escape to step back."></canvas>

    <header class="top">
      <p class="wordmark">Jackob</p>
      <button type="button" class="step-back" id="step-back" hidden>
        <span aria-hidden="true">←</span> Step back
      </button>
    </header>

    <footer class="bottom">
      <div class="caption" id="caption" aria-hidden="true">
        <p class="caption-name">Charcoal denim jacket</p>
        <p class="caption-note">Hand-painted back</p>
      </div>
      <p class="hint" id="hint" aria-live="polite">Click the rack to step closer</p>
    </footer>

    <p class="loading" id="loading" role="status">Hanging the jacket…</p>
    <noscript>
      <p class="noscript">This room is interactive and needs JavaScript. Turn it on to see the jacket in 3D.</p>
    </noscript>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
